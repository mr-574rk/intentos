version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intentos-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - EXECUTION_MODE=mock
      - INITIA_RPC=https://rpc.testnet.initia.xyz
      - CHAIN_ID=initiation-2
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - intentos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intentos-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_CHAIN_ID=initiation-2
      - NEXT_PUBLIC_EXECUTION_MODE=mock
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - intentos-net

networks:
  intentos-net:
    driver: bridge
